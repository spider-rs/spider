[workspace]
members = [
    "spider",
    "spider_worker",
    "spider_cli",
    "spider_utils",
    "spider_agent",
    "spider_agent_types",
    "spider_agent_html",
    "spider_mcp",
    # internal
    "examples",
    "benches"]
resolver = "2"

# Unify the external `spider_transformations` crate onto this workspace's
# `spider` instead of pulling a second copy from crates.io. This removes a
# duplicate `spider` compile and keeps the whole tree on one (patched, audited)
# quick-xml. Patch sections are local-only and ignored on publish.
[patch.crates-io]
spider = { path = "spider" }
# Pin the audited public browser and shared cache client for workspace builds.
chromey = { git = "https://github.com/spider-rs/chromey", rev = "0312d624ea2feb4dfa77699213f1d7ca388358ac" }
spider_remote_cache = { git = "https://github.com/spider-rs/spider_remote_cache", rev = "910fefb7aeec80d39fed5f5ff44a8bfc7f3437dc" }
